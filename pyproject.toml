[project]
name = "prismapi"
version = "0.1.0-beta.1"
description = "PrismAPI — field-aware systematic review + meta-analysis platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "structlog>=24.1",
  "rapidfuzz>=3.9",
  "rq>=1.16",
  "redis>=5.0",
  "httpx>=0.27",
  "biopython>=1.83",
  "xmltodict>=0.13",
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "email-validator>=2.2",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "vcrpy>=6.0",
  "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prismapi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/prismapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
