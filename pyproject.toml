[project]
name = "prismapi"
version = "0.1.0-beta.1"
description = "Desktop app for PRISMA-2020 systematic reviews: CustomTkinter GUI over an in-process SQLite engine"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "customtkinter>=5.2.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.14",
  "sqlalchemy[asyncio]>=2.0.49",
  "aiosqlite>=0.22",
  "pyyaml>=6.0",
  "jsonschema>=4.25",
  "numpy>=2.3",
  "rapidfuzz>=3.14",
  "httpx>=0.28",
  "pillow>=12.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]
build = [
  "pyinstaller>=6.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prismapi", "gui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# E501: long lines are fine at 100 with occasional overruns.
# RUF001/2/3: α, κ, and en dashes are intentional in an IRR tool's UI
# strings and docstrings.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Importing the handler modules IS the registration mechanism.
"prismapi/rpc/handlers/__init__.py" = ["F401"]
# PicoIn's field names are the PICO wire format (P/I/C/O/T/S).
"prismapi/rpc/handlers/projects.py" = ["E741"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["prismapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
