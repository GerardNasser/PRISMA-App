id: environmental__ecology
version: 0.3.0
effective_date: "2026-08-16"
field: environmental
review_type: ecology
label: "Environmental / ecology"
summary: >
  Systematic reviews in ecology and conservation biology. ROSES reporting
  (CEE), log response ratio as the dominant effect size, multilevel /
  phylogenetic random-effects models for non-independent effect sizes.

reporting:
  primary: PRISMA_2020
  extensions: [PRISMA_S]
  notes: ROSES (roses-reporting.com) is the field-preferred reporting standard for environmental management questions.

registries:
  primary: OSF
  alternatives: [PROCEED]
  notes: >
    PROCEED (proceedevidence.info) is CEE's registry for environmental
    evidence syntheses. PROSPERO is not listed: it only accepts reviews
    with a health-related outcome.

databases:
  required: [web_of_science, scopus]
  recommended: [cab_abstracts, biosis, agris]
  grey_literature_mandatory: true

extraction_template:
  base: PRISMA_GENERIC
  fields:
    - {key: study_id, label: "Study ID", type: text, required: true, group: source}
    - {key: doi, label: "DOI", type: doi, group: source}
    - {key: title, label: "Title", type: text, required: true, group: source}
    - {key: authors, label: "Authors", type: text, required: true, group: source}
    - {key: year, label: "Year", type: integer, required: true, group: source}
    - {key: location, label: "Location / biome", type: text, group: design}
    - {key: design, label: "Study design", type: select_one,
       options: [experimental, observational, before_after, control_impact, gradient, modelling, other], required: true, group: design}
    - {key: taxa, label: "Taxa / system studied", type: text, group: pico}
    - {key: intervention_or_driver, label: "Intervention / driver", type: longtext, required: true, group: pico}
    - {key: control, label: "Control", type: longtext, group: pico}
    - {key: response_variable, label: "Response variable", type: text, required: true, group: results}
    - {key: n_per_group, label: "N per group", type: integer, group: results}
    - {key: mean_treatment, label: "Mean (treatment)", type: number, group: results}
    - {key: sd_treatment, label: "SD (treatment)", type: number, group: results}
    - {key: mean_control, label: "Mean (control)", type: number, group: results}
    - {key: sd_control, label: "SD (control)", type: number, group: results}
    - {key: notes, label: "Reviewer notes", type: longtext, group: meta}

# CEESAT appraises whole evidence syntheses, not primary studies, so it is
# wrong here (see Frampton et al. 2022 for study-level principles). These
# domains adapt the standard internal-validity structure to field studies.
risk_of_bias:
  tool: CUSTOM
  domains:
    - {key: confounding, label: "Confounding / baseline differences between compared groups"}
    - {key: selection, label: "Selection of sites, plots, or subjects into the study"}
    - {key: performance, label: "Performance: unintended differences in conditions between groups"}
    - {key: detection, label: "Detection: measurement of the response variable"}
    - {key: attrition, label: "Attrition: missing or incomplete outcome data"}
    - {key: reporting, label: "Selective reporting of outcomes or analyses"}
  scale: [low, some_concerns, high, no_information]

effect_sizes:
  default: lnrr
  allowed: [lnrr, smd_hedges_g, log_or, r]

synthesis:
  model_default: multilevel_rma_mv
  modules: [forest, funnel, leave_one_out, subgroup, meta_regression, knapp_hartung, prediction_interval, multilevel]

publication_bias:
  required_methods: [egger, trim_fill_sensitivity]
  default_panel: [egger, trim_fill_sensitivity]

certainty:
  framework: GRADE
  notes: >
    GRADE, adapted to environmental evidence per the CEE guidelines. CEESAT
    is a synthesis-level appraisal tool (it rates whole reviews) — use it on
    the finished review, not on individual studies.

modules:
  screening: true
  irr: true
  extraction: true
  risk_of_bias: true
  synthesis_quantitative: true
  publication_bias: true
  certainty: true
  prisma_flow: true
  manuscript_export: true

qrp_warnings:
  - key: pseudoreplication
    severity: warn
    message: >
      Site-level pseudoreplication and shared control re-use are the dominant
      independence violations in ecology. Plan multilevel or phylogenetic
      models (metafor::rma.mv) from the start.

citations:
  - "Haddaway NR, Macura B, Whaley P, Pullin AS. 2018. ROSES. Environ Evid 7:7."
  - "Nakagawa S, Santos ESA. 2012. Methodological issues and advances in biological meta-analysis."
  - "Frampton G, Whaley P, Bennett M, et al. 2022. Principles and framework for assessing the risk of bias for studies included in comparative quantitative environmental systematic reviews. Environ Evid 11:12."
  - "Collaboration for Environmental Evidence. 2022. Guidelines and Standards for Evidence Synthesis in Environmental Management, v5.1. environmentalevidence.org."
